name: .NET Build

on:
  pull_request:
    branches:
      - main
      - development
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0'

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore